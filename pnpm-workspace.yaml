autoInstallPeers: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
  '@nestjs/core': false
  workerd: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
# Security floors for vulnerable sub-dependencies (keep in step with
# "overrides" in package.json, which npm uses on Hostinger).
overrides:
  axios: '^1.20.0'
  brace-expansion@<1.1.21: '^1.1.21'
  brace-expansion@>=2.0.0 <2.1.7: '^2.1.7'
  brace-expansion@>=4.0.0 <5.0.12: '^5.0.12'
  fast-uri: '^3.1.8'
  hono: '^4.13.7'
  ip-address: '^10.7.1'
  js-yaml@>=3.0.0 <3.15.2: '^3.15.2'
  js-yaml@>=4.0.0 <4.3.2: '^4.3.2'
  multer: '^2.4.0'
  piscina@>=5.0.0 <5.3.2: '^5.3.2'
  postcss@<8.5.23: '^8.5.23'
  qs: '^6.16.0'
  smol-toml: '^1.7.1'
  undici@>=6.0.0 <6.28.1: '^6.28.1'
  uuid@<11.1.1: '^11.1.1'
  webpack-dev-middleware@>=8.0.0 <8.3.0: '^8.3.0'
  webpack-dev-server@<5.2.6: '^5.2.6'
