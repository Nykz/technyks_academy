  <head>
    <meta charset="utf-8">
    <title>Technyks Academy - Master Software Architecture</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#040810">
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('technyks-theme');
          var isDark = savedTheme
            ? savedTheme === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(
            isDark ? 'dark' : 'light-theme',
          );
          document.documentElement.classList.add(
            isDark ? 'dark-theme' : 'theme-pending',
          );
        } catch (_) {
          var systemDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(
            systemDark ? 'dark' : 'light-theme',
          );
          document.documentElement.classList.add(
            systemDark ? 'dark-theme' : 'theme-pending',
          );
        }
      })();
    </script>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #040810;
        color: #fff;
        transition:
          opacity 260ms ease,
          visibility 260ms ease;
      }
      html.light-theme #app-preloader {
        background: #f8fafc;
        color: #0f172a;
      }
      #app-preloader.app-preloader-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .app-preloader-mark {
        display: grid;
        justify-items: center;
        gap: 18px;
        font:
          700 18px/1.2 Inter,
          system-ui,
          sans-serif;
        letter-spacing: -0.02em;
      }
      .app-preloader-logo span {
        color: #3b82f6;
      }
      .app-preloader-line {
        width: 132px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.25);
      }
      .app-preloader-line::after {
        content: '';
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: #3b82f6;
        animation: app-preloader-slide 900ms ease-in-out infinite alternate;
      }
      @keyframes app-preloader-slide {
        to {
          transform: translateX(128%);
        }
      }
      html:not(.material-icons-ready) .material-symbols-outlined {
        visibility: hidden !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .app-preloader-line::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
