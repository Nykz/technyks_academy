    <script>
      (function () {
        try {
          // Light mode for everyone unless they chose dark with the toggle.
          var isDark = localStorage.getItem('technyks-theme') === 'dark';
          document.documentElement.classList.add(
            isDark ? 'dark' : 'light-theme',
          );
          document.documentElement.classList.add(
            isDark ? 'dark-theme' : 'theme-pending',
          );
        } catch (_) {
          document.documentElement.classList.add('light-theme');
          document.documentElement.classList.add('theme-pending');
        }
      })();
    </script>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #040810;
        color: #fff;
        transition:
          opacity 260ms ease,
          visibility 260ms ease;
      }
      html.light-theme #app-preloader {
        background: #f8fafc;
        color: #0f172a;
      }
      #app-preloader.app-preloader-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .app-preloader-mark {
        display: grid;
        justify-items: center;
        gap: 18px;
        font:
          700 18px/1.2 Inter,
          system-ui,
          sans-serif;
        letter-spacing: -0.02em;
      }
      .app-preloader-logo span {
        color: #3b82f6;
      }
      .app-preloader-line {
        width: 132px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.25);
      }
      .app-preloader-line::after {
        content: '';
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: #3b82f6;
        animation: app-preloader-slide 900ms ease-in-out infinite alternate;
      }
      @keyframes app-preloader-slide {
        to {
          transform: translateX(128%);
        }
      }
      html:not(.material-icons-ready) .material-symbols-outlined {
        visibility: hidden !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .app-preloader-line::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
